# ============================================================================
# PostgreSQL — pg_hba.conf hardening (generic, no real data)
# ============================================================================
# Tujuan    : Pola access control di level koneksi sesuai docs/05 §2
#             (least privilege, TLS, authentication kuat).
# Lokasi    : $PGDATA/pg_hba.conf — urutan top-down, MATCH PERTAMA menang.
# Catatan   :
#   - Gunakan scram-sha-256 (bukan md5) untuk password.
#   - Koneksi aplikasi/service WAJIB lewat channel terenkripsi (hostssl).
#   - Subnet contoh 10.0.0.0/8 = zona internal; sesuaikan dengan zonasi org
#     (docs/03 §3).
# ============================================================================

# TYPE  DATABASE        USER                ADDRESS                 METHOD
# ---------------------------------------------------------------------
# Admin lokal via OS (peer) — hanya superuser setempat
local   all             postgres                                   peer

# Akses replikasi (streaming) — hanya dari host standby yang diketahui
hostssl replication     repl_user           10.0.0.0/8              scram-sha-256
host    replication     repl_user           127.0.0.1/32            scram-sha-256

# Aplikasi (service account) — via TLS saja, subnet data zone
hostssl all             app_read            10.0.0.0/8              scram-sha-256
hostssl all             app_rw              10.0.0.0/8              scram-sha-256

# DBA maintenance via jump/bastion host (docs/03 §3) — TLS forced
hostssl all             dba_bastion         10.1.0.0/16             scram-sha-256

# Default-deny: apa pun yang tidak cocok di atas TOLAK
host    all             all                 0.0.0.0/0               reject
host    all             all                 ::/0                    reject
local   all             all                                        reject